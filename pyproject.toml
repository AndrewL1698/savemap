[project]
name = "savemap"
version = "0.1.0"
description = "Turn saved TikToks & Reels into an Obsidian topic map"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.scripts]
savemap = "savemap.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/savemap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
